name: MediChannel CI/CD

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: medichannel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==================================================
  # 1. BACKEND CI - BUILD AND TEST
  # ==================================================

  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: medichannel_test
          POSTGRES_USER: medichannel_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medichannel_test -d medichannel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/medichannel_test
      DB_USERNAME: medichannel_test
      DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Verify backend executable JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend
        run: |
          test -s target/backend-0.0.1-SNAPSHOT.jar
          echo "Backend JAR verified"
          ls -lh target/backend-0.0.1-SNAPSHOT.jar

      - name: Upload backend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: medichannel-backend
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  # ==================================================
  # 2. FRONTEND CI - BUILD AND TEST
  # ==================================================

  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1

      - name: Verify standalone deployment output
        working-directory: frontend
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          echo "Next.js standalone build verified"

      - name: Prepare standalone deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: |
          mkdir -p .next/standalone/.next/static

          cp -a .next/static/. .next/standalone/.next/static/

          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -a public/. .next/standalone/public/
          fi

      - name: Upload frontend deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: medichannel-frontend
          path: frontend/.next/standalone/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # ==================================================
  # 3. PRODUCTION DEPLOYMENT
  # ==================================================

  deploy-production:
    name: Deploy - Production EC2
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success'

    steps:
      # ----------------------------------------------
      # 3.1 DOWNLOAD BUILD ARTIFACTS
      # ----------------------------------------------

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: medichannel-backend
          path: ${{ runner.temp }}/backend-artifact

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: medichannel-frontend
          path: ${{ runner.temp }}/frontend-artifact

      - name: Prepare deployment packages
        run: |
          set -euo pipefail

          test -s "$RUNNER_TEMP/backend-artifact/backend-0.0.1-SNAPSHOT.jar"
          test -f "$RUNNER_TEMP/frontend-artifact/server.js"
          test -f "$RUNNER_TEMP/frontend-artifact/.next/BUILD_ID"

          cp "$RUNNER_TEMP/backend-artifact/backend-0.0.1-SNAPSHOT.jar" \
             "$RUNNER_TEMP/backend-artifact/app.jar"

          tar -czf "$RUNNER_TEMP/frontend.tar.gz" \
            -C "$RUNNER_TEMP/frontend-artifact" .

          echo "Deployment packages prepared successfully."

      # ----------------------------------------------
      # 3.2 CONFIGURE SSH USING EXISTING SECRETS
      # ----------------------------------------------

      - name: Configure SSH authentication
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          FRONTEND_SSH_KEY: ${{ secrets.FRONTEND_SSH_KEY }}
          BACKEND_SSH_KEY: ${{ secrets.BACKEND_SSH_KEY }}

        run: |
          set -euo pipefail

          : "${SSH_USER:?DEPLOY_USER secret is missing}"
          : "${FRONTEND_HOST:?FRONTEND_HOST secret is missing}"
          : "${BACKEND_HOST:?BACKEND_HOST secret is missing}"
          : "${FRONTEND_SSH_KEY:?FRONTEND_SSH_KEY secret is missing}"
          : "${BACKEND_SSH_KEY:?BACKEND_SSH_KEY secret is missing}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$FRONTEND_SSH_KEY" \
            > "$RUNNER_TEMP/frontend_key"

          printf '%s\n' "$BACKEND_SSH_KEY" \
            > "$RUNNER_TEMP/backend_key"

          chmod 600 "$RUNNER_TEMP/frontend_key"
          chmod 600 "$RUNNER_TEMP/backend_key"

          ssh-keygen -y -f "$RUNNER_TEMP/frontend_key" > /dev/null
          ssh-keygen -y -f "$RUNNER_TEMP/backend_key" > /dev/null

          ssh-keyscan -H "$FRONTEND_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

          ssh-keyscan -H "$BACKEND_HOST" \
            >> ~/.ssh/known_hosts 2>/dev/null

          chmod 600 ~/.ssh/known_hosts

          echo "SSH keys configured."

      # ----------------------------------------------
      # 3.3 VERIFY BOTH SSH CONNECTIONS
      # ----------------------------------------------

      - name: Verify EC2 SSH connections
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}

        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/frontend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "echo Frontend SSH connection successful"

          ssh \
            -i "$RUNNER_TEMP/backend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${BACKEND_HOST}" \
            "echo Backend SSH connection successful"

      # ==================================================
      # 3A. BACKEND DEPLOYMENT
      # ==================================================

      - name: Upload backend JAR
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}

        run: |
          set -euo pipefail

          scp \
            -i "$RUNNER_TEMP/backend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/backend-artifact/app.jar" \
            "${SSH_USER}@${BACKEND_HOST}:/tmp/medichannel-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"

      - name: Deploy backend to EC2
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}

        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/backend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${BACKEND_HOST}" \
            "sudo -n bash -s -- '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'

          set -euo pipefail

          DEPLOY_ID="$1"

          APP_DIR="/home/deploy/apps/medichannel/backend"
          BACKUP_DIR="$APP_DIR/deployment-backups"

          NEW_JAR="/tmp/medichannel-app-${DEPLOY_ID}.jar"
          BACKUP_JAR="$BACKUP_DIR/app.jar.${DEPLOY_ID}"

          mkdir -p "$BACKUP_DIR"

          test -s "$NEW_JAR"
          test -s "$APP_DIR/app.jar"

          install -o deploy -g deploy -m 0644 \
            "$NEW_JAR" "$APP_DIR/app.jar.new"

          cp -p "$APP_DIR/app.jar" "$BACKUP_JAR"

          rollback_backend() {
            echo "Rolling back backend..."

            systemctl stop medichannel-backend || true

            cp -p "$BACKUP_JAR" "$APP_DIR/app.jar"

            systemctl start medichannel-backend

            echo "Backend rollback completed."
          }

          systemctl stop medichannel-backend

          mv -f "$APP_DIR/app.jar.new" "$APP_DIR/app.jar"

          if ! systemctl start medichannel-backend; then
            rollback_backend
            exit 1
          fi

          HEALTH_OK=0

          for i in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8080/api/v1/health >/dev/null \
              && curl -fsS \
              http://127.0.0.1:8080/api/v1/db-health >/dev/null; then

              HEALTH_OK=1
              break
            fi

            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Backend health check failed."
            rollback_backend
            exit 1
          fi

          echo "Backend deployment successful: $DEPLOY_ID"

          rm -f "$NEW_JAR"

          REMOTE

      # ==================================================
      # 3B. FRONTEND DEPLOYMENT
      # ==================================================

      - name: Upload frontend package
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

        run: |
          set -euo pipefail

          scp \
            -i "$RUNNER_TEMP/frontend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/frontend.tar.gz" \
            "${SSH_USER}@${FRONTEND_HOST}:/tmp/medichannel-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Deploy frontend to EC2
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/frontend_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${FRONTEND_HOST}" \
            "sudo -n bash -s -- '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" <<'REMOTE'

          set -euo pipefail

          DEPLOY_ID="$1"

          APP_ROOT="/home/deploy/apps/medichannel"

          CURRENT="$APP_ROOT/frontend"
          STAGING="$APP_ROOT/frontend-staging-${DEPLOY_ID}"
          BACKUP="$APP_ROOT/frontend-backup-${DEPLOY_ID}"

          ARCHIVE="/tmp/medichannel-frontend-${DEPLOY_ID}.tar.gz"

          test -s "$ARCHIVE"
          test -d "$CURRENT"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          tar -xzf "$ARCHIVE" -C "$STAGING"

          test -f "$STAGING/server.js"
          test -f "$STAGING/.next/BUILD_ID"

          chown -R deploy:deploy "$STAGING"

          rollback_frontend() {
            echo "Rolling back frontend..."

            systemctl stop medichannel-frontend || true

            if [ -d "$CURRENT" ]; then
              mv "$CURRENT" "$APP_ROOT/frontend-failed-${DEPLOY_ID}"
            fi

            if [ -d "$BACKUP" ]; then
              mv "$BACKUP" "$CURRENT"
            fi

            systemctl start medichannel-frontend

            echo "Frontend rollback completed."
          }

          systemctl stop medichannel-frontend

          mv "$CURRENT" "$BACKUP"

          if ! mv "$STAGING" "$CURRENT"; then
            mv "$BACKUP" "$CURRENT"
            systemctl start medichannel-frontend
            exit 1
          fi

          if ! systemctl start medichannel-frontend; then
            rollback_frontend
            exit 1
          fi

          HEALTH_OK=0

          for i in $(seq 1 30); do

            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              HEALTH_OK=1
              break
            fi

            sleep 2
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "Frontend health check failed."
            rollback_frontend
            exit 1
          fi

          echo "Frontend deployment successful: $DEPLOY_ID"

          rm -f "$ARCHIVE"

          REMOTE

      # ==================================================
      # 4. FINAL DEPLOYMENT VERIFICATION
      # ==================================================

      - name: Verify public application
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}

        run: |
          set -euo pipefail

          curl --retry 5 --retry-delay 3 --retry-all-errors \
            -fsS "http://${FRONTEND_HOST}/" >/dev/null

          curl --retry 5 --retry-delay 3 --retry-all-errors \
            -fsS "http://${FRONTEND_HOST}/api/v1/health"

          curl --retry 5 --retry-delay 3 --retry-all-errors \
            -fsS "http://${FRONTEND_HOST}/api/v1/db-health"

          echo ""
          echo "Public application verification successful."

      - name: Production deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "MediChannel production deployment"
          echo "======================================"
          echo "Commit: $GITHUB_SHA"
          echo "Backend: SUCCESS"
          echo "Frontend: SUCCESS"
          echo "Deployment: SUCCESS"

      - name: Clean up SSH keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/frontend_key"
          rm -f "$RUNNER_TEMP/backend_key"
