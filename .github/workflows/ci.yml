name: MediChannel CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    # Start a temporary PostgreSQL database for testing
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: medichannel_test
          POSTGRES_USER: medichannel_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medichannel_test -d medichannel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Spring Boot database configuration for CI
    env:
      DB_URL: jdbc:postgresql://localhost:5432/medichannel_test
      DB_USERNAME: medichannel_test
      DB_PASSWORD: test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify standalone deployment output
        working-directory: frontend
        run: |
          test -f .next/standalone/server.js
          test -d .next/static
          echo "Next.js standalone build verified"
